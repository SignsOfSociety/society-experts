                { term: "Заработная плата", definition: "Вознаграждение за труд в зависимости от квалификации, сложности, количества и качества работы (билет 18)." },
                { term: "План: Заработная плата", definition: "1. Понятие заработной платы. 2. Виды (повременная, сдельная, премиальная). 3. Факторы, влияющие на размер зарплаты. 4. Проблемы (задержки, минимальный размер) (билет 18)." },
                { term: "Потребности", definition: "Нужды людей в необходимых для жизни и развития благах и услугах (билет 19)." },
                { term: "Пирамида Маслоу", definition: "Иерархия потребностей: физиологические → безопасность → социальные → признание → самоактуализация (билет 19)." },
                { term: "Международная экономика", definition: "Совокупность экономических отношений между странами: торговля, финансы, инвестиции, миграция (билет 20)." },
                { term: "Глобальные проблемы человечества", definition: "Проблемы, затрагивающие всё человечество: экология, войны, бедность, демография, энергетика (билет 21)." },
                { term: "План: Глобальные проблемы", definition: "1. Понятие глобальных проблем. 2. Примеры: экология, терроризм, бедность. 3. Пути решения (ООН, международные договоры, устойчивое развитие) (билет 21)." },
                { term: "Право в системе социальных норм", definition: "Право — система общеобязательных норм, установленных государством, формально определённых и обеспеченных санкциями (билет 22)." },
                { term: "Инфляция", definition: "Рост общего уровня цен, обесценивание денег. Виды: умеренная, галопирующая, гиперинфляция. Влияет на покупательную способность семьи (билет 23)." },
                { term: "Социология", definition: "Наука о закономерностях развития, функционирования и изменения общества, его структуре и социальных группах (билет 24)." },
                { term: "Социальные группы", definition: "Совокупности людей, объединённых общими признаками (интересами, статусом, деятельностью): семья, класс, нация, профессиональная группа (билет 24)." },
                { term: "Демографическая ситуация в РФ", definition: "Снижение рождаемости, старение населения, естественная убыль, миграционный прирост (билет 25)." },
                { term: "Социализация", definition: "Процесс усвоения индивидом социальных норм, ценностей, знаний, навыков, необходимых для жизни в обществе (билет 26)." },
                { term: "Образование в РФ", definition: "Дошкольное, общее (начальное, основное, среднее), среднее профессиональное, высшее. Образование — основа социального успеха (билет 27)." },
                { term: "Культура", definition: "Совокупность материальных и духовных ценностей, созданных и используемых обществом (билет 28)." },
                { term: "Молодёжная субкультура", definition: "Совокупность ценностей, норм, образцов поведения, специфических для молодёжной среды (билет 28)." }
            ];

            let currentView = "missions";
            let currentMission = null;
            let currentQuestionIndex = 0;
            let missionQuestions = [];
            let answered = false;
            let lives = 3;
            const MAX_LIVES = 3;
            let score = 0;
            let combo = 0;
            let streak = 0;
            let correctAnswersInMission = 0;
            let currentTimeout = null;

            let highScores = JSON.parse(localStorage.getItem("societyHighScores") || "{}");
            let stats = { total: 0, correct: 0, wrong: 0 };
            function loadStats() {
                const saved = localStorage.getItem("societyStats");
                if (saved) { try { stats = JSON.parse(saved); } catch(e) {} }
            }
            function saveStats() { localStorage.setItem("societyStats", JSON.stringify(stats)); }
            loadStats();

            let masteredTickets = new Set(JSON.parse(localStorage.getItem("societyMastered") || "[]"));
            function saveMastered() { localStorage.setItem("societyMastered", JSON.stringify([...masteredTickets])); }

            let missionStats = JSON.parse(localStorage.getItem("societyMissionStats") || "{}");
            function saveMissionStats() { localStorage.setItem("societyMissionStats", JSON.stringify(missionStats)); }

            function updateHighScore(missionId, finalScore) {
                if (!highScores[missionId] || finalScore > highScores[missionId]) {
                    highScores[missionId] = finalScore;
                    localStorage.setItem("societyHighScores", JSON.stringify(highScores));
                }
            }
            function updateMissionStats(missionId, isCorrect) {
                if (!missionStats[missionId]) missionStats[missionId] = { correct: 0, wrong: 0 };
                if (isCorrect) missionStats[missionId].correct++;
                else missionStats[missionId].wrong++;
                saveMissionStats();
            }

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;
            function playSound(type) {
                if (!AudioContext) return;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                if (type === "correct") {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === "wrong") {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === "portal") {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
            function shuffleOptions(q) {
                const correctAnswer = q.options[q.correct];
                const shuffled = shuffleArray([...q.options]);
                const newCorrectIndex = shuffled.indexOf(correctAnswer);
                return { ...q, options: shuffled, correct: newCorrectIndex };
            }
            function clearQuestionTimeout() {
                if (currentTimeout) { clearTimeout(currentTimeout); currentTimeout = null; }
            }
            function render() {
                clearQuestionTimeout();
                if (currentView === "missions") renderMissions();
                else if (currentView === "terms") renderTerms();
                else if (currentView === "profile") renderProfile();
            }

            function renderMissions() {
                let html = '<h2 style="text-align:center; margin-bottom:30px;">🎓 Выбери тему для изучения</h2><div class="period-grid">';
                missions.forEach(m => {
                    const high = highScores[m.id] || 0;
                    html += `<div class="period-card" data-mission="${m.id}"><span class="period-icon">${m.icon}</span><span>${m.name}</span><span class="period-highscore">🏆 ${high}</span></div>`;
                });
                html += "</div>";
                contentDiv.innerHTML = html;
                document.querySelectorAll(".period-card").forEach(card => {
                    card.addEventListener("click", () => startMission(card.dataset.mission));
                });
            }

            function startMission(missionId) {
                clearQuestionTimeout();
                lives = MAX_LIVES; score = 0; combo = 0; streak = 0; correctAnswersInMission = 0; answered = false;
                currentMission = missionId; currentQuestionIndex = 0;
                missionQuestions = shuffleArray([...questionsDB[missionId]]);
                if (missionQuestions.length === 0) { alert("❌ В этой теме пока нет вопросов"); return; }
                renderQuestion();
            }

            function renderQuestion() {
                if (currentQuestionIndex >= missionQuestions.length && lives > 0) {
                    if (correctAnswersInMission >= 8) showBonusQuestion();
                    else showMissionComplete();
                    return;
                }
                if (lives <= 0) { showGameOver(); return; }
                let q = missionQuestions[currentQuestionIndex];
                q = shuffleOptions(q);
                let badge = "";
                if (q.type === "plan") badge = '<span class="question-badge">📋 Конструктор плана</span>';
                else if (q.type === "fill") badge = '<span class="question-badge">✏️ Пропущенное слово</span>';
                else if (q.ticket) badge = `<span class="question-badge">🎫 Билет №${q.ticket}</span>`;
                else badge = '<span class="question-badge">📝 Закрепление</span>';
                let html = `<button class="back-btn" id="back-from-question">← К выбору темы</button>
                    <div class="game-hud">
                        <div class="lives">${[...Array(MAX_LIVES)].map((_,i)=>`<span class="heart ${i<lives?"":"empty"}">❤️</span>`).join("")}</div>
                        <div class="combo">x${combo}</div>
                        <div class="score">⭐ ${score}</div>
                    </div>
                    <div class="question-box">${badge}<div class="question-text">${q.question}</div>
                    <div class="options" id="options-container">`;
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-opt-index="${idx}">${opt}</button>`;
                });
                html += `</div><div id="question-feedback" class="feedback"></div></div>`;
                contentDiv.innerHTML = html;
                document.getElementById("back-from-question").addEventListener("click", () => {
                    clearQuestionTimeout(); currentMission = null; renderMissions();
                });
                const optionBtns = document.querySelectorAll(".option-btn");
                optionBtns.forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        if (answered) return;
                        const selected = parseInt(e.target.dataset.optIndex);
                        const isCorrect = (selected === q.correct);
                        optionBtns.forEach((b, i) => {
                            if (i === q.correct) b.classList.add("correct");
                            else if (i === selected && !isCorrect) b.classList.add("wrong");
                        });
                        if (isCorrect) {
                            playSound("correct");
                            const points = 100 * (combo + 1);
                            score += points; stats.correct++; correctAnswersInMission++; streak++;
                            combo = Math.min(streak, 3);
                            if (lives < MAX_LIVES) lives++;
                            if (q.ticket) { masteredTickets.add(q.ticket); saveMastered(); }
                        } else {
                            playSound("wrong");
                            stats.wrong++; lives--; streak = 0; combo = 0;
                        }
                        stats.total++; saveStats(); updateMissionStats(currentMission, isCorrect);
                        answered = true;
                        document.getElementById("question-feedback").textContent = isCorrect ? "✅ Верно!" : `❌ Неверно. Правильный ответ: ${q.options[q.correct]}`;
                        clearQuestionTimeout();
                        currentTimeout = setTimeout(() => {
                            if (lives <= 0) showGameOver();
                            else { currentQuestionIndex++; answered = false; renderQuestion(); }
                            currentTimeout = null;
                        }, 1500);
                    });
                });
            }

            function showBonusQuestion() {
                const bonus = bonusQuestionsDB[currentMission];
                if (!bonus) { showMissionComplete(); return; }
                playSound("portal");
                contentDiv.classList.add("portal-effect");
                setTimeout(() => contentDiv.classList.remove("portal-effect"), 2000);
                let html = `<button class="back-btn" id="back-from-question">← Пропустить бонус</button>
                    <div class="game-hud">
                        <div class="lives">${[...Array(MAX_LIVES)].map((_,i)=>`<span class="heart ${i<lives?"":"empty"}">❤️</span>`).join("")}</div>
                        <div class="combo">x${combo}</div>
                        <div class="score">⭐ ${score}</div>
                    </div>
                    <div class="question-box">
                        <span class="question-badge">🌟 Билет на отлично</span>
                        <div class="question-text" style="color:gold;">${bonus.question}</div>
                        <div class="options" id="options-container">`;
                bonus.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" data-opt-index="${idx}">${opt}</button>`;
                });
                html += `</div><div id="question-feedback" class="feedback"></div></div>`;
                contentDiv.innerHTML = html;
                document.getElementById("back-from-question").addEventListener("click", () => {
                    clearQuestionTimeout(); currentMission = null; renderMissions();
                });
                const optionBtns = document.querySelectorAll(".option-btn");
                optionBtns.forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        if (answered) return;
                        const selected = parseInt(e.target.dataset.optIndex);
                        const isCorrect = (selected === bonus.correct);
                        optionBtns.forEach((b, i) => {
                            if (i === bonus.correct) b.classList.add("correct");
                            else if (i === selected && !isCorrect) b.classList.add("wrong");
                        });
                        if (isCorrect) { playSound("portal"); score += bonus.reward; stats.correct++; }
                        else { playSound("wrong"); stats.wrong++; }
                        stats.total++; saveStats(); updateMissionStats(currentMission, isCorrect);
                        answered = true;
                        document.getElementById("question-feedback").textContent = isCorrect ? `✅ +${bonus.reward} очков!` : `❌ Правильно: ${bonus.options[bonus.correct]}`;
                        clearQuestionTimeout();
                        currentTimeout = setTimeout(() => { showMissionComplete(); currentTimeout = null; }, 2000);
                    });
                });
            }

            function showGameOver() {
                clearQuestionTimeout();
                contentDiv.innerHTML = `
                    <div style="text-align:center; padding:40px;">
                        <h2 style="font-size:3rem; margin-bottom:20px;">💔 Миссия провалена</h2>
                        <p style="font-size:1.5rem; margin-bottom:30px;">Не сдавайся! Повтори билеты и попробуй снова.</p>
                        <p style="font-size:2rem; margin-bottom:30px;">Заработано очков: ${score}</p>
                        <button class="back-btn" id="restart-mission">🔄 Новая попытка</button>
                        <button class="back-btn" id="back-to-missions">🎓 К выбору тем</button>
                    </div>`;
                document.getElementById("restart-mission").addEventListener("click", () => { clearQuestionTimeout(); startMission(currentMission); });
                document.getElementById("back-to-missions").addEventListener("click", () => { clearQuestionTimeout(); currentMission = null; renderMissions(); });
            }

            function showMissionComplete() {
                clearQuestionTimeout();
                updateHighScore(currentMission, score);
                const perfect = correctAnswersInMission === missionQuestions.length;
                const message = perfect ? "🌟 Тема освоена идеально! Ты — Знаток!" : "🎉 Тема пройдена!";
                contentDiv.innerHTML = `
                    <div style="text-align:center; padding:40px;">
                        <h2 style="font-size:3rem; margin-bottom:20px;">${message}</h2>
                        <p style="font-size:2rem; margin-bottom:20px;">Итоговый счёт: ${score}</p>
                        <p style="font-size:1.5rem; margin-bottom:30px;">Правильных ответов: ${correctAnswersInMission} из ${missionQuestions.length}</p>
                        <button class="back-btn" id="back-to-missions">🎓 Новая тема</button>
                    </div>`;
                document.getElementById("back-to-missions").addEventListener("click", () => { clearQuestionTimeout(); currentMission = null; renderMissions(); });
            }

            function renderTerms() {
                let html = '<h2 style="text-align:center;">📚 Библиотека знаний (28 билетов)</h2><div class="terms-list">';
                termsLibrary.forEach(item => {
                    html += `<div class="term-item"><span class="term-name">${item.term}</span><span class="term-def">${item.definition}</span></div>`;
                });
                html += "</div>";
                contentDiv.innerHTML = html;
            }

            function renderProfile() {
                const total = stats.total || 0;
                const correct = stats.correct || 0;
                const wrong = stats.wrong || 0;
                const accuracy = total ? Math.round((correct / total) * 100) : 0;
                const masteredCount = masteredTickets.size;
                let comment = "";
                if (total === 0) comment = "🚀 Начни своё первое путешествие в мир обществознания!";
                else if (accuracy >= 80) comment = "🌟 Отличный результат! Ты настоящий Знаток общества!";
                else if (accuracy >= 60) comment = "👍 Хорошая работа, есть к чему стремиться.";
                else if (accuracy >= 40) comment = "🤔 Нужно больше практики. Загляни в библиотеку!";
                else comment = "💪 Терпение и труд всё перетрут. Попробуй ещё!";
                let weakTopicsHtml = "";
                const weakTopics = [];
                missions.forEach(m => {
                    const ms = missionStats[m.id];
                    if (ms && (ms.correct + ms.wrong > 0)) {
                        const errPct = Math.round((ms.wrong / (ms.correct + ms.wrong)) * 100);
                        if (errPct > 30) weakTopics.push({ name: m.name, pct: errPct });
                    }
                });
                if (weakTopics.length > 0) {
                    weakTopicsHtml = '<div class="weak-topics"><h3 style="text-align:center; margin-bottom:15px;">📉 Темы для повторения</h3>';
                    weakTopics.forEach(wt => {
                        weakTopicsHtml += `<div class="weak-topic-item"><span class="weak-topic-name">${wt.name}</span><span class="weak-topic-pct">${wt.pct}% ошибок</span></div>`;
                    });
                    weakTopicsHtml += "</div>";
                } else if (total > 0) {
                    weakTopicsHtml = '<div style="text-align:center; margin-top:20px; color:#00ff88;">✅ Слабых тем пока нет. Так держать!</div>';
                }
                let html = `
                    <h2 style="text-align:center;">👤 Личный кабинет Знатока</h2>
                    <div class="stats">
                        <div class="stat-card"><div class="stat-value">${masteredCount}</div><div class="stat-label">освоено билетов из 28</div></div>
                        <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">всего ответов</div></div>
                        <div class="stat-card"><div class="stat-value">${correct}</div><div class="stat-label">✅ верно</div></div>
                        <div class="stat-card"><div class="stat-value">${wrong}</div><div class="stat-label">❌ ошибок</div></div>
                        <div class="stat-card"><div class="stat-value">${accuracy}%</div><div class="stat-label">точность</div></div>
                    </div>
                    <div class="comment">${comment}</div>
                    ${weakTopicsHtml}
                    <button class="back-btn" id="reset-stats" style="display:block;margin:30px auto 0;">♻️ Сбросить прогресс</button>`;
                contentDiv.innerHTML = html;
                document.getElementById("reset-stats")?.addEventListener("click", () => {
                    if (confirm("Сбросить всю статистику, рекорды и прогресс по билетам?")) {
                        stats = { total: 0, correct: 0, wrong: 0 };
                        highScores = {}; masteredTickets = new Set(); missionStats = {};
                        saveStats(); localStorage.setItem("societyHighScores", "{}"); saveMastered(); saveMissionStats();
                        renderProfile();
                    }
                });
            }

            const contentDiv = document.getElementById("content-area");
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    clearQuestionTimeout();
                    currentView = e.target.dataset.view;
                    currentMission = null;
                    render();
                });
            });
            render();
        })();
    </script>
</body>
</html>
